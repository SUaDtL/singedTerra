project_id = "your-project-id"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.vector]
# Keep the linked free-tier project posture explicit. Omitting this lets the CLI
# scaffold default request vector buckets during a full config push.
enabled = false

[auth]
# ADR-0011: optional durable accounts use password auth while anonymous play and
# per-room seat-token authorization remain available and unchanged.
enabled = true
site_url = "https://suadtl.github.io/singedTerra/"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true
# Enforce the same minimum at the public Auth boundary as the client form.
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
# No SMTP/provider dependency in the foundation slice. Revisit before enabling
# email ownership claims, recovery, or magic-link/OTP flows.
enable_confirmations = false
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
# Preserve the linked project's existing MFA posture even though the foundation
# UI does not expose enrollment yet.
enroll_enabled = true
verify_enabled = true

[realtime]
enabled = true

[functions.create_room]
verify_jwt = false

[functions.join_room]
verify_jwt = false

[functions.ready_up]
verify_jwt = false

[functions.submit_action]
verify_jwt = false

[functions.update_player]
verify_jwt = false

[functions.leave_room]
verify_jwt = false

[functions.list_rooms]
verify_jwt = false

[functions.finish_game]
verify_jwt = false

[functions.heartbeat]
verify_jwt = false

[functions.restart_game]
verify_jwt = false

[functions.claim_match]
verify_jwt = false

[functions.account_summary]
verify_jwt = false

[functions.record_hotseat_match]
verify_jwt = false

[functions.verified_replay_probe]
verify_jwt = false
