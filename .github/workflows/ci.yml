name: CI

# The determinism invariant (hot-seat and every networked client run identical
# physics) is the project's foundation — these jobs gate it on every PR so a
# change that breaks lockstep/determinism can't merge silently.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: classify changes and verify CI policy
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      base_sha: ${{ steps.changes.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Verify event commits, migration history and change scope
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # On pull_request, github.sha is GitHub's verified synthetic merge result.
          # The source branch SHA alone can omit a migration added to the current base.
          PR_HEAD_SHA: ${{ github.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            base="$PUSH_BASE_SHA"
            head="$PUSH_HEAD_SHA"
          else
            echo "Unsupported CI event" >&2
            exit 1
          fi
          if [ -z "$base" ] || [ -z "$head" ] || [[ "$base" =~ ^0+$ ]] || [[ "$head" =~ ^0+$ ]]; then
            echo "Missing immutable base/head evidence for migration history" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "+$base:refs/remotes/origin/migration-history-base" "+$head:refs/remotes/origin/migration-history-head"
          git cat-file -e "$base^{commit}"
          git cat-file -e "$head^{commit}"
          git update-ref refs/remotes/origin/main "$base"
          node scripts/checks/migration_classification.mjs --check history --base "$base" --head "$head"
          CI_BASE_SHA="$base" CI_HEAD_SHA="$head" node scripts/ci/changeScope.mjs
          echo "base_sha=$base" >> "$GITHUB_OUTPUT"
      - name: Migration-history disposable Git regressions
        run: node --test scripts/checks/migration_classification.test.mjs
      - name: Release-candidate policy and digest regressions
        run: node --test scripts/ci/releaseCandidate.test.mjs scripts/ci/releaseWorkflow.test.mjs
      - name: Documentation evidence-template contracts
        run: node --test scripts/checks/manual_baseline.test.mjs
      - name: Scope and required-result regressions
        run: node --test scripts/ci/changeScope.test.mjs scripts/ci/requiredResult.test.mjs scripts/ci/ciWorkflow.test.mjs

  check-work:
    name: engine, database, client and build
    needs: scope
    if: needs.scope.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Restore the exact migration baseline for engine checks
        env:
          CI_BASE_SHA: ${{ needs.scope.outputs.base_sha }}
        run: git fetch --no-tags --depth=1 origin "+$CI_BASE_SHA:refs/remotes/origin/main"
      - name: Audit runtime and build dependencies
        run: npm run audit:deps
      - run: npm run check         # typecheck (shared + client) + the deterministic harnesses
      - name: PostgreSQL foreign keys and transactional lifecycle regressions
        run: npm run check:database
      - run: npm run test:client   # vitest (jsdom) — client DOM + fetch unit tests
      - run: npm run build

  edge-work:
    name: Edge runtime tests
    needs: scope
    if: needs.scope.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Deno type-checks the referee code, and the supabase-js import resolves
      # @types/node from node_modules — so npm ci must run before deno test.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # Remote Deno imports occasionally return transient 5xx responses before
      # any test executes. Retry twice, but preserve a persistent failure.
      - name: Run Edge tests with bounded retry
        run: bash scripts/ci/run-edge-tests.sh

  browser:
    # Real-browser rendering guardrails (Playwright). The jsdom unit tests can't
    # observe COMPUTED LAYOUT, so a HUD flex-crush shipped despite green unit tests;
    # this job builds the PRODUCTION bundle and asserts real geometry in Chromium.
    name: browser (${{ matrix.lane }})
    needs: scope
    if: needs.scope.outputs.docs_only == 'false'
    strategy:
      fail-fast: false
      matrix:
        lane: [core-1, core-2, product]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Cache the Playwright browser binaries, keyed on the installed Playwright
      # version, so we don't re-download Chromium on every run.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      # On a cache miss download the browser + its OS deps; on a hit just ensure the
      # OS deps are present (the cached binary needs them but they aren't cached).
      - name: Install Playwright browser (+ deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: General browser shard 1
        if: matrix.lane == 'core-1'
        run: npm run test:e2e -- --shard=1/2 --workers=2
      - name: General browser shard 2
        if: matrix.lane == 'core-2'
        run: npm run test:e2e -- --shard=2/2 --workers=2
      - name: Battle console responsive and interaction checks
        if: matrix.lane == 'product'
        run: npx playwright test -c playwright.product-completion.config.ts
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.lane }}-${{ github.run_attempt }}
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: warn

  check:
    name: typecheck · harnesses · build
    if: always()
    needs: [scope, check-work]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate required result
        run: node scripts/ci/requiredResult.mjs
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          WORK_RESULT: ${{ needs.check-work.result }}

  edge:
    name: edge function tests (deno)
    if: always()
    needs: [scope, edge-work]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate required result
        run: node scripts/ci/requiredResult.mjs
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          WORK_RESULT: ${{ needs.edge-work.result }}

  e2e:
    name: e2e · rendering guardrails
    if: always()
    needs: [scope, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate required result
        run: node scripts/ci/requiredResult.mjs
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          WORK_RESULT: ${{ needs.browser.result }}
